# Разворачивается на сервере Дениса: Fedora CoreOS, Docker 29.7.2.
#
# Два момента, специфичных для этой машины:
#
# 1. SELinux в enforcing. Суффикс `:z` нужен на КАЖДОМ bind-mount, иначе
#    контейнер получит Permission denied — причём не при старте, а в работе,
#    на конкретной операции. Не «лечить» это через `label=disable`: так
#    отключается SELinux для контейнера, который парсит недоверенные URL
#    из публичного чата, то есть ровно для того, ради чего он и нужен.
#
# 2. Временные файлы лежат на 2 ТБ HDD (`/mnt/storage/data`), а не на
#    128-гиговом SSD: видео пишутся и удаляются постоянно, за год это заметный
#    износ. `/tmp` внутри контейнера — tmpfs в оперативке, туда видео нельзя.

services:
  protomap-dl:
    build: .
    container_name: protomap-dl
    restart: unless-stopped

    # Docker по умолчанию даёт на остановку 10 секунд, потом убивает. Этого мало:
    # воркер при SIGTERM дорабатывает начатое, а не успев — возвращает задачи
    # в очередь, чтобы после перезапуска их подхватили сразу, а не через
    # десять минут по таймауту зависших.
    stop_grace_period: 30s

    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

    # 256 МБ, а не 64: yt-dlp собран PyInstaller'ом и при запуске распаковывает
    # себя во временный каталог — бандл весит 40 МБ, в распакованном виде больше.
    # На 64 МБ он падает с «decompression resulted in return code -1», причём
    # ошибка ничего не говорит про место. Скачивания идут в /work, а не сюда:
    # tmpfs живёт в оперативной памяти, и видео туда класть нельзя.
    tmpfs:
      - /tmp:size=256m,exec

    # DATA_DIR вынесен в переменную, чтобы тот же файл работал и на сервере,
    # и на машине разработчика при проверке. По умолчанию — путь на HDD сервера.
    volumes:
      - ${DATA_DIR:-/mnt/storage/data/protomap-dl}/work:/work:z
      - ${DATA_DIR:-/mnt/storage/data/protomap-dl}/bin:/opt/ytdlp:z
      - ${DATA_DIR:-/mnt/storage/data/protomap-dl}/secrets/sa.json:/secrets/sa.json:ro,z

    # Лимиты не для экономии, а чтобы одна кривая ссылка не утащила машину:
    # yt-dlp на некоторых источниках умеет разворачивать плейлист в сотни
    # процессов, а склейка большого файла — съедать память.
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256

    env_file: .env

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
